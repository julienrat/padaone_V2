<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone : niveau à bulle (météo)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
.sig{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:18px;background:transparent;font:inherit;font-size:12px;color:#FFFFFF;cursor:pointer}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
    <span style="padding: 4px 12px; border-radius: 999px; background: #49A8FF; border: 2px solid #1B1530; font-size: 14px; font-weight: 700">Météo d'arrivée</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.4; stroke-linecap: round"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M3 8c-1 2-1 6 0 8"></path><path d="M21 8c1 2 1 6 0 8"></path></svg>Mouvement actif</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 12px; min-height: 0">
    <div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">Comment arrivez-vous ?</h1>
      <p style="margin: 6px 0 0; font-size: 15px; color: #5B5570">Penchez le téléphone pour faire rouler la bille, puis posez-le à plat pour valider.</p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-size: 13px; font-weight: 700">Plein d'énergie</span>
      <button type="button" onClick="{{place}}" aria-label="Plateau météo : touchez pour simuler l'inclinaison" style="position: relative; width: 318px; height: 318px; padding: 0; border-radius: 40px; border: 4px solid #1B1530; box-shadow: 6px 6px 0 #1B1530; overflow: hidden; background: #FFFFFF; cursor: crosshair; font: inherit">
        <span style="position: absolute; left: 0; top: 0; width: 50%; height: 50%; background: #FFC2E4"></span>
        <span style="position: absolute; right: 0; top: 0; width: 50%; height: 50%; background: #FFE58A"></span>
        <span style="position: absolute; left: 0; bottom: 0; width: 50%; height: 50%; background: #E4DAFF"></span>
        <span style="position: absolute; right: 0; bottom: 0; width: 50%; height: 50%; background: #A8F0DC"></span>
        <span style="position: absolute; left: 12px; top: 12px; font-size: 13px; font-weight: 700">Tendu·e</span>
        <span style="position: absolute; right: 12px; top: 12px; font-size: 13px; font-weight: 700">Enthousiaste</span>
        <span style="position: absolute; left: 12px; bottom: 12px; font-size: 13px; font-weight: 700">Las·se</span>
        <span style="position: absolute; right: 12px; bottom: 12px; font-size: 13px; font-weight: 700">Serein·e</span>
        <span style="position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px dashed #1B1530; box-sizing: border-box"></span>
        <span style="position: absolute; left: {{x}}%; top: {{y}}%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #6C3BFF; border: 3px solid #1B1530; box-shadow: 3px 4px 0 rgba(27, 21, 48, 0.35); transition: left 600ms cubic-bezier(.34,1.3,.64,1), top 600ms cubic-bezier(.34,1.3,.64,1)"></span>
      </button>
      <div style="width: 318px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span>Morose</span><span>Fatigué·e</span><span>Joyeux·se</span></div>
    </div>

    <details style="font-size: 14px">
      <summary style="min-height: 40px; display: flex; align-items: center; font-weight: 700; color: #4A1FD1">Régler avec des curseurs</summary>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 2px">
        <label for="energie" style="display: flex; flex-direction: column; gap: 4px">Énergie<input id="energie" type="range" min="0" max="100" value="{{energy}}" onChange="{{setEnergy}}" style="width: 100%; accent-color: #6C3BFF"></label>
        <label for="humeur" style="display: flex; flex-direction: column; gap: 4px">Humeur<input id="humeur" type="range" min="0" max="100" value="{{x}}" onChange="{{setMood}}" style="width: 100%; accent-color: #6C3BFF"></label>
      </div>
    </details>

    <button type="button" onClick="{{send}}" style="margin-top: auto; min-height: 58px; border-radius: 20px; border: 3px solid #1B1530; background: {{sendBg}}; color: {{sendInk}}; box-shadow: 4px 4px 0 #1B1530; font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 800; cursor: pointer">{{sendLabel}}</button>
  </main>

  <nav aria-label="Signal discret" style="margin: 0 12px 14px; padding: 6px; border-radius: 26px; background: #1B1530; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <button type="button" class="sig"><span class="ic" style="background: #FFD23F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M4 6l7 6-7 6"></path><path d="M13 6l7 6-7 6"></path></svg></span>Trop vite</button>
    <button type="button" class="sig"><span class="ic" style="background: #FF7AC6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 9a3 3 0 0 1 6 1c0 2-3 2.5-3 4.5"></path><path d="M12 18.5v.5"></path></svg></span>Perdu·e</button>
    <button type="button" class="sig"><span class="ic" style="background: #2DD4A7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></span>Un exemple</button>
    <button type="button" class="sig"><span class="ic" style="background: #49A8FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg></span>Une pause</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { x: 70, y: 30, sent: false };
  }
  renderVals() {
    const s = this.state;
    const clamp = (v) => Math.max(8, Math.min(92, v));
    return {
      x: Math.round(s.x),
      y: Math.round(s.y),
      energy: Math.round(100 - s.y),
      place: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({
          x: clamp(((e.clientX - r.left) / r.width) * 100),
          y: clamp(((e.clientY - r.top) / r.height) * 100),
          sent: false
        });
      },
      setEnergy: (e) => this.setState({ y: clamp(100 - Number(e.target.value)), sent: false }),
      setMood: (e) => this.setState({ x: clamp(Number(e.target.value)), sent: false }),
      send: () => this.setState({ sent: true }),
      sendLabel: s.sent ? 'Validé, merci !' : 'Valider (ou poser à plat)',
      sendBg: s.sent ? '#2DD4A7' : '#6C3BFF',
      sendInk: s.sent ? '#1B1530' : '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
