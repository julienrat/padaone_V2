<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Projection : pouce en l'air</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 30px 48px 30px; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; flex-direction: column; gap: 10px">
    <span style="align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: #2DD4A7; border: 2px solid #1B1530; font-size: 17px; font-weight: 700">Pouce en l'air</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 42px; line-height: 1.05; font-weight: 800; letter-spacing: -1px">On déplace la réunion du collectif au mardi soir ?</h1>
    <p style="margin: 0; font-size: 20px; color: #5B5570">Levez votre téléphone : debout, c'est pour. Tête en bas, c'est contre. Posé à plat, vous passez.</p>
  </header>

  <div style="flex: 1 1 auto; display: flex; gap: 28px; min-height: 0">
    <div style="flex: 1 1 auto; padding: 22px; border-radius: 32px; background: #FFFFFF; border: 3px solid #1B1530; box-shadow: 6px 6px 0 #1B1530; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px; align-content: center">
      <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="34">
        <span style="aspect-ratio: 1; border-radius: 18px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center; transition: background 300ms">
          <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate({{t.rot}}deg); transition: transform 420ms cubic-bezier(.34,1.56,.64,1)"><path d="M7 10v11H4.5A1.5 1.5 0 0 1 3 19.5v-8A1.5 1.5 0 0 1 4.5 10H7z" fill="#FFFFFF" stroke="#1B1530" style="stroke-width: 1.8; stroke-linejoin: round"></path><path d="M7 10l3.6-6.6A2 2 0 0 1 14.3 4.6L13.5 9H19a2 2 0 0 1 2 2.4l-1.5 7.6A2.5 2.5 0 0 1 17 21H7z" fill="#FFFFFF" stroke="#1B1530" style="stroke-width: 1.8; stroke-linejoin: round"></path></svg>
        </span>
      </sc-for>
    </div>

    <aside style="flex: 0 0 340px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-radius: 24px; background: #2DD4A7; border: 3px solid #1B1530; box-shadow: 5px 5px 0 #1B1530">
        <span style="font-size: 22px; font-weight: 700">Pour</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 56px; font-weight: 800; line-height: 1">{{up}}</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-radius: 24px; background: #FF6B4A; border: 3px solid #1B1530; box-shadow: 5px 5px 0 #1B1530">
        <span style="font-size: 22px; font-weight: 700">Contre</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 56px; font-weight: 800; line-height: 1">{{down}}</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-radius: 24px; background: #FFFFFF; border: 3px solid #1B1530">
        <span style="font-size: 22px; font-weight: 700">Je passe</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 56px; font-weight: 800; line-height: 1">{{flat}}</span>
      </div>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 17px; color: #5B5570">Balance en direct</span>
        <div style="display: flex; height: 28px; border-radius: 14px; overflow: hidden; border: 3px solid #1B1530">
          <div style="width: {{upPct}}%; background: #2DD4A7; transition: width 300ms"></div>
          <div style="width: {{flatPct}}%; background: #FFFFFF; transition: width 300ms"></div>
          <div style="width: {{downPct}}%; background: #FF6B4A; transition: width 300ms"></div>
        </div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const init = [];
    for (let i = 0; i < 34; i++) init.push(i % 7 === 3 ? 2 : (i % 4 === 1 ? 1 : 0));
    this.seed = 4242;
    this.state = { v: init };
  }
  rnd() {
    this.seed = (this.seed * 16807) % 2147483647;
    return this.seed / 2147483647;
  }
  componentDidMount() {
    this._iv = setInterval(() => {
      const v = this.state.v.slice();
      for (let k = 0; k < 3; k++) {
        const i = Math.floor(this.rnd() * v.length);
        const r = this.rnd();
        v[i] = r < 0.62 ? 0 : (r < 0.85 ? 1 : 2);
      }
      this.setState({ v });
    }, 900);
  }
  componentWillUnmount() {
    clearInterval(this._iv);
  }
  renderVals() {
    const v = this.state.v;
    const up = v.filter((x) => x === 0).length;
    const down = v.filter((x) => x === 1).length;
    const flat = v.length - up - down;
    const n = v.length;
    return {
      up, down, flat,
      upPct: (up / n) * 100,
      downPct: (down / n) * 100,
      flatPct: (flat / n) * 100,
      thumbs: v.map((x, i) => ({
        i,
        rot: x === 0 ? 0 : (x === 1 ? 180 : 90),
        bg: x === 0 ? '#2DD4A7' : (x === 1 ? '#FF6B4A' : '#EDE8FA')
      }))
    };
  }
}
</script>
</body>
</html>
