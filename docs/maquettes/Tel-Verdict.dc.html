<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone : Verdict au jugement majoritaire</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
.sig{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:18px;background:transparent;font:inherit;font-size:12px;color:#FFFFFF;cursor:pointer}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
    <span style="padding: 4px 12px; border-radius: 999px; background: #B9A6FF; border: 2px solid #1B1530; font-size: 14px; font-weight: 700">Verdict · {{done}}/4 notées</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2DD4A7; border: 2px solid #1B1530"></span>Connecté</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 10px; overflow-y: auto; min-height: 0">
    <div style="padding: 0 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 25px; line-height: 1.1; font-weight: 800; letter-spacing: -0.5px">Quel aménagement pour la place du Marché ?</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5B5570">Une mention par proposition, de « à rejeter » à « excellent ».</p>
    </div>

    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <section style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 22px; background: #FFFFFF; border: 3px solid #1B1530">
        <h2 style="margin: 0; font-size: 16px; line-height: 1.25; font-weight: 700">{{c.name}}</h2>
        <div role="group" aria-label="Mention pour {{c.name}}" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{c.steps}}" as="m" hint-placeholder-count="6">
            <button type="button" onClick="{{m.pick}}" aria-label="{{m.name}}" aria-pressed="{{m.pressed}}" style="height: 44px; border-radius: 14px; border: 2px solid #1B1530; background: {{m.color}}; opacity: {{m.opacity}}; transform: {{m.lift}}; box-shadow: {{m.shadow}}; transition: transform 150ms; cursor: pointer"></button>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #5B5570"><span>À rejeter</span><span style="padding: 2px 10px; border-radius: 999px; background: {{c.chipBg}}; color: {{c.chipInk}}; font-size: 14px; font-weight: 700">{{c.chosen}}</span><span>Excellent</span></div>
      </section>
    </sc-for>

    <button type="button" onClick="{{send}}" disabled="{{cannotSend}}" style="min-height: 56px; margin-top: 2px; border-radius: 20px; border: 3px solid #1B1530; background: {{sendBg}}; color: #FFFFFF; box-shadow: {{sendShadow}}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; cursor: pointer">{{sendLabel}}</button>
  </main>

  <nav aria-label="Signal discret" style="margin: 0 12px 14px; padding: 6px; border-radius: 26px; background: #1B1530; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <button type="button" class="sig"><span class="ic" style="background: #FFD23F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M4 6l7 6-7 6"></path><path d="M13 6l7 6-7 6"></path></svg></span>Trop vite</button>
    <button type="button" class="sig"><span class="ic" style="background: #FF7AC6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 9a3 3 0 0 1 6 1c0 2-3 2.5-3 4.5"></path><path d="M12 18.5v.5"></path></svg></span>Perdu·e</button>
    <button type="button" class="sig"><span class="ic" style="background: #2DD4A7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></span>Un exemple</button>
    <button type="button" class="sig"><span class="ic" style="background: #49A8FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg></span>Une pause</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { grades: [4, 3, null, null], sent: false };
  }
  renderVals() {
    const s = this.state;
    const mentions = [
      { name: 'À rejeter', color: '#D9381E', ink: '#FFFFFF' },
      { name: 'Insuffisant', color: '#FF8A5B', ink: '#1B1530' },
      { name: 'Passable', color: '#EDE8FA', ink: '#1B1530' },
      { name: 'Assez bien', color: '#B9A6FF', ink: '#1B1530' },
      { name: 'Bien', color: '#7C4DFF', ink: '#FFFFFF' },
      { name: 'Excellent', color: '#4A1FD1', ink: '#FFFFFF' }
    ];
    const names = [
      'Halles couvertes ouvertes toute l’année',
      'Jardin partagé et jeux pour enfants',
      'Parking réorganisé et terrasses',
      'Garder la place en l’état'
    ];
    const done = s.grades.filter((g) => g !== null).length;
    const all = done === names.length;
    return {
      done,
      cannotSend: !all || s.sent,
      sendBg: all && !s.sent ? '#6C3BFF' : '#A79FC2',
      sendShadow: all && !s.sent ? '4px 4px 0 #1B1530' : 'none',
      sendLabel: s.sent ? 'Vote envoyé, merci !' : (all ? 'Envoyer mon vote' : 'Notez les 4 propositions'),
      send: () => { if (all) this.setState({ sent: true }); },
      cards: names.map((name, k) => {
        const g = s.grades[k];
        return {
          name,
          chosen: g === null ? 'à noter' : mentions[g].name,
          chipBg: g === null ? '#F6F3FF' : mentions[g].color,
          chipInk: g === null ? '#5B5570' : mentions[g].ink,
          steps: mentions.map((m, i) => ({
            name: m.name,
            color: m.color,
            pressed: g === i ? 'true' : 'false',
            opacity: g === null || g === i ? 1 : 0.35,
            lift: g === i ? 'translate(-2px, -3px)' : 'none',
            shadow: g === i ? '2px 3px 0 #1B1530' : 'none',
            pick: () => {
              const next = s.grades.slice();
              next[k] = i;
              this.setState({ grades: next, sent: false });
            }
          }))
        };
      })
    };
  }
}
</script>
</body>
</html>
