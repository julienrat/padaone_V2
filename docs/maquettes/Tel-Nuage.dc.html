<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone : nuage de mots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
.sig{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:18px;background:transparent;font:inherit;font-size:12px;color:#FFFFFF;cursor:pointer}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
    <span style="padding: 4px 12px; border-radius: 999px; background: #FF7AC6; border: 2px solid #1B1530; font-size: 14px; font-weight: 700">Nuage de mots</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2DD4A7; border: 2px solid #1B1530"></span>Connecté</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 12px; min-height: 0">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">En un mot : c'est quoi, une bonne réunion ?</h1>
    <p style="margin: 0; font-size: 15px; color: #5B5570">Jusqu'à 3 mots. Vous pouvez aussi dicter avec le micro du clavier.</p>

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; gap: 8px">
          <label for="mot" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Votre mot</label>
          <input id="mot" value="{{draft}}" onChange="{{typing}}" onKeyDown="{{enter}}" maxlength="25" placeholder="{{placeholder}}" disabled="{{full}}" style="flex: 1 1 auto; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; border: 3px solid #1B1530; background: #FFFFFF; font: inherit; font-size: 19px; color: #1B1530">
          <button type="button" onClick="{{add}}" disabled="{{full}}" aria-label="Ajouter le mot" style="flex: 0 0 56px; height: 56px; border-radius: 18px; border: 3px solid #1B1530; background: #FFD23F; box-shadow: 3px 3px 0 #1B1530; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 3; stroke-linecap: round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
            <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 14px; border-radius: 999px; background: {{c.bg}}; border: 2px solid #1B1530; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">{{c.text}}<button type="button" onClick="{{c.remove}}" aria-label="Retirer {{c.text}}" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 3; stroke-linecap: round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></span>
          </sc-for>
        </div>
        <div style="display: flex; gap: 6px" aria-hidden="true">
          <sc-for list="{{slots}}" as="d" hint-placeholder-count="3"><span style="flex: 1 1 0; height: 8px; border-radius: 4px; border: 2px solid #1B1530; background: {{d.bg}}"></span></sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 16px; border-radius: 26px; background: #FFFFFF; border: 3px solid #1B1530; box-shadow: 5px 5px 0 #1B1530; text-align: center">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 46a12 12 0 0 1 1-24 15 15 0 0 1 28 4 10 10 0 0 1-1 20z" fill="#FF7AC6" stroke="#1B1530" style="stroke-width: 3; stroke-linejoin: round"></path><path d="M24 34l6 6 11-12" fill="none" stroke="#1B1530" style="stroke-width: 4; stroke-linecap: round; stroke-linejoin: round"></path></svg>
        <p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">Envoyé !</p>
        <p style="margin: 0; font-size: 16px; color: #5B5570">Regardez l'écran : vos mots grossissent quand d'autres pensent pareil.</p>
        <button type="button" onClick="{{edit}}" style="min-height: 46px; padding: 0 18px; border-radius: 16px; border: 2px solid #1B1530; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #1B1530">Modifier mes mots</button>
      </div>
    </sc-if>

    <button type="button" onClick="{{send}}" disabled="{{cannotSend}}" style="margin-top: auto; min-height: 60px; border-radius: 20px; border: 3px solid #1B1530; background: {{sendBg}}; color: #FFFFFF; box-shadow: {{sendShadow}}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; cursor: pointer">{{sendLabel}}</button>
  </main>

  <nav aria-label="Signal discret" style="margin: 0 12px 14px; padding: 6px; border-radius: 26px; background: #1B1530; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <button type="button" class="sig"><span class="ic" style="background: #FFD23F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M4 6l7 6-7 6"></path><path d="M13 6l7 6-7 6"></path></svg></span>Trop vite</button>
    <button type="button" class="sig"><span class="ic" style="background: #FF7AC6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 9a3 3 0 0 1 6 1c0 2-3 2.5-3 4.5"></path><path d="M12 18.5v.5"></path></svg></span>Perdu·e</button>
    <button type="button" class="sig"><span class="ic" style="background: #2DD4A7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></span>Un exemple</button>
    <button type="button" class="sig"><span class="ic" style="background: #49A8FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg></span>Une pause</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { words: ['écoute', 'café'], draft: '', sent: false };
  }
  addWord() {
    const w = this.state.draft.trim();
    if (!w || this.state.words.length >= 3) return;
    this.setState({ words: this.state.words.concat([w]), draft: '' });
  }
  renderVals() {
    const s = this.state;
    const tints = ['#FFD23F', '#2DD4A7', '#B9A6FF'];
    const full = s.words.length >= 3;
    const can = s.words.length > 0 && !s.sent;
    return {
      draft: s.draft,
      full,
      placeholder: full ? '3 mots, c’est complet' : 'Tapez un mot',
      sent: s.sent,
      notSent: !s.sent,
      chips: s.words.map((t, i) => ({
        text: t,
        bg: tints[i % 3],
        remove: () => this.setState({ words: s.words.filter((_, k) => k !== i) })
      })),
      slots: [0, 1, 2].map((i) => ({ bg: i < s.words.length ? '#6C3BFF' : '#FFFFFF' })),
      typing: (e) => this.setState({ draft: e.target.value }),
      enter: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.addWord(); } },
      add: () => this.addWord(),
      cannotSend: !can,
      sendBg: can ? '#6C3BFF' : '#A79FC2',
      sendShadow: can ? '4px 4px 0 #1B1530' : 'none',
      sendLabel: s.sent ? 'Mots envoyés' : 'Envoyer',
      send: () => { if (can) this.setState({ sent: true }); },
      edit: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
