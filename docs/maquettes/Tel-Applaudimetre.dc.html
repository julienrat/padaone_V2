<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone : applaudimètre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
.sig{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:18px;background:transparent;font:inherit;font-size:12px;color:#FFFFFF;cursor:pointer}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
    <span style="padding: 4px 12px; border-radius: 999px; background: #FFD23F; border: 2px solid #1B1530; font-size: 14px; font-weight: 700">Applaudimètre</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FF6B4A; border: 2px solid #1B1530"></span>Le micro écoute</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 4px 20px 12px; min-height: 0">
    <h1 style="align-self: stretch; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">Applaudissez pour B · Théâtre-forum !</h1>

    <div style="position: relative; width: 236px; height: 236px; display: flex; align-items: center; justify-content: center">
      <span style="position: absolute; inset: 0; border-radius: 50%; background: #FFD23F; opacity: 0.45; transform: scale({{ring1}}); transition: transform 200ms ease-out"></span>
      <span style="position: absolute; inset: 26px; border-radius: 50%; background: #FF7AC6; opacity: 0.55; transform: scale({{ring2}}); transition: transform 200ms ease-out"></span>
      <span style="position: relative; width: 140px; height: 140px; border-radius: 50%; background: #6C3BFF; border: 4px solid #1B1530; box-shadow: 4px 4px 0 #1B1530; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" aria-hidden="true" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; line-height: 1">{{level}}</span>
      </span>
    </div>

    <div role="img" aria-label="Niveau sonore {{level}} sur 100" style="align-self: stretch; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; align-items: end; height: 70px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="12">
        <span style="height: {{b.h}}%; border-radius: 6px; border: 2px solid #1B1530; background: {{b.bg}}; transition: background 120ms"></span>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14px; color: #5B5570; text-align: center">Le son n'est jamais enregistré : seul ce niveau part vers l'écran.</p>

    <button type="button" onClick="{{tap}}" style="align-self: stretch; min-height: 64px; border-radius: 20px; border: 3px dashed #1B1530; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B1530; cursor: pointer"><strong>Pas de micro ?</strong> Tapotez ici le plus vite possible</button>
    <button type="button" onClick="{{toggleDemo}}" style="margin-top: auto; align-self: stretch; min-height: 56px; border-radius: 20px; border: 3px solid #1B1530; background: {{demoBg}}; color: {{demoInk}}; box-shadow: 4px 4px 0 #1B1530; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; cursor: pointer">{{demoLabel}}</button>
  </main>

  <nav aria-label="Signal discret" style="margin: 0 12px 14px; padding: 6px; border-radius: 26px; background: #1B1530; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <button type="button" class="sig"><span class="ic" style="background: #FFD23F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M4 6l7 6-7 6"></path><path d="M13 6l7 6-7 6"></path></svg></span>Trop vite</button>
    <button type="button" class="sig"><span class="ic" style="background: #FF7AC6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 9a3 3 0 0 1 6 1c0 2-3 2.5-3 4.5"></path><path d="M12 18.5v.5"></path></svg></span>Perdu·e</button>
    <button type="button" class="sig"><span class="ic" style="background: #2DD4A7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></span>Un exemple</button>
    <button type="button" class="sig"><span class="ic" style="background: #49A8FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg></span>Une pause</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.seq = [8, 22, 45, 63, 78, 86, 91, 84, 88, 80, 72, 85, 90, 77, 60, 41, 25, 12];
    this.state = { level: 64, demo: false, i: 0 };
  }
  componentDidMount() {
    this._iv = setInterval(() => {
      if (this.state.demo) {
        const i = (this.state.i + 1) % this.seq.length;
        this.setState({ i, level: this.seq[i] });
      } else if (this.state.level > 0) {
        this.setState({ level: Math.max(0, this.state.level - 3) });
      }
    }, 220);
  }
  componentWillUnmount() {
    clearInterval(this._iv);
  }
  renderVals() {
    const s = this.state;
    const colorAt = (k) => (k < 4 ? '#2DD4A7' : (k < 8 ? '#FFD23F' : (k < 10 ? '#FF6B4A' : '#6C3BFF')));
    return {
      level: s.level,
      ring1: (0.55 + s.level / 220).toFixed(3),
      ring2: (0.6 + s.level / 160).toFixed(3),
      bars: Array.from({ length: 12 }, (_, k) => ({
        h: 30 + k * 6,
        bg: s.level >= ((k + 1) * 100) / 12 ? colorAt(k) : '#FFFFFF'
      })),
      tap: () => this.setState({ demo: false, level: Math.min(100, s.level + 9) }),
      toggleDemo: () => this.setState({ demo: !s.demo }),
      demoLabel: s.demo ? 'Arrêter la démo' : 'Démo : simuler des applaudissements',
      demoBg: s.demo ? '#1B1530' : '#FFD23F',
      demoInk: s.demo ? '#FFFFFF' : '#1B1530'
    };
  }
}
</script>
</body>
</html>
