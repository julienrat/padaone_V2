<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Projection : applaudimètre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 30px 48px 30px; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: #FFD23F; border: 2px solid #1B1530; font-size: 17px; font-weight: 700">Applaudimètre</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 42px; line-height: 1.05; font-weight: 800; letter-spacing: -1px">Quel atelier cet après-midi ? Applaudissez !</h1>
    </div>
    <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #1B1530; font-size: 17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>Mesuré par <strong>31 téléphones</strong></span>
  </header>

  <div style="flex: 1 1 auto; display: flex; gap: 28px; min-height: 0">
    <div style="flex: 1 1 auto; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 32px; background: #FFFFFF; border: 3px solid #1B1530; box-shadow: 6px 6px 0 #1B1530">
      <span style="position: absolute; left: 24px; top: 20px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #FF6B4A; border: 2px solid #1B1530; font-size: 17px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1B1530"></span>En direct : B · Théâtre-forum</span>
      <svg width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Jauge de l'applaudimètre, niveau {{level}} sur 100">
        <path d="{{seg1}}" fill="none" stroke="#2DD4A7" style="stroke-width: 56"></path>
        <path d="{{seg2}}" fill="none" stroke="#FFD23F" style="stroke-width: 56"></path>
        <path d="{{seg3}}" fill="none" stroke="#FF6B4A" style="stroke-width: 56"></path>
        <path d="{{seg4}}" fill="none" stroke="#6C3BFF" style="stroke-width: 56"></path>
        <path d="{{outline}}" fill="none" stroke="#1B1530" style="stroke-width: 3"></path>
        <g style="transform: rotate({{peakDeg}}deg); transform-origin: 300px 290px; transition: transform 300ms ease-out">
          <path d="M300 18 l-12 -16 h24 z" fill="#1B1530"></path>
        </g>
        <g style="transform: rotate({{deg}}deg); transform-origin: 300px 290px; transition: transform 260ms cubic-bezier(.34,1.56,.64,1)">
          <path d="M292 290 L300 80 L308 290 Z" fill="#1B1530"></path>
        </g>
        <circle cx="300" cy="290" r="22" fill="#1B1530"></circle>
        <circle cx="300" cy="290" r="9" fill="#FFD23F"></circle>
      </svg>
      <div style="display: flex; align-items: baseline; gap: 12px; margin-top: -6px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 76px; font-weight: 800; line-height: 1">{{level}}</span>
        <span style="font-size: 22px; color: #5B5570">/ 100 · pic {{peak}}</span>
      </div>
    </div>

    <aside style="flex: 0 0 380px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 24px; background: #FFFFFF; border: 3px solid #1B1530">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: #E4DAFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">A</span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 19px; font-weight: 700">Jeu de rôle</span>
          <div style="height: 14px; border-radius: 7px; background: #F6F3FF"><div style="width: 72%; height: 14px; border-radius: 7px; background: #6C3BFF"></div></div>
        </div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">72</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 24px; background: #FFE1D6; border: 3px solid #1B1530; box-shadow: 5px 5px 0 #1B1530">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: #FF6B4A; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">B</span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 19px; font-weight: 700">Théâtre-forum</span>
          <div style="height: 14px; border-radius: 7px; background: #FFFFFF"><div style="width: {{peak}}%; height: 14px; border-radius: 7px; background: #FF6B4A; transition: width 300ms"></div></div>
        </div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">{{peak}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 24px; background: #FFFFFF; border: 3px dashed #1B1530">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: #F6F3FF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">C</span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 19px; font-weight: 700">Étude de cas</span>
          <span style="font-size: 16px; color: #5B5570">À applaudir ensuite</span>
        </div>
      </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 24px; background: #1B1530; color: #FFFFFF">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 6h3v2a3 3 0 0 1-3 3"></path><path d="M7 6H4v2a3 3 0 0 0 3 3"></path></svg>
        <span style="font-size: 18px">Record de la journée : <strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; color: #FFD23F">91</strong></span>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.seq = [6, 18, 38, 58, 74, 83, 88, 84, 89, 80, 66, 44, 24, 10, 4, 4];
    this.state = { i: 6, peak: 88 };
  }
  componentDidMount() {
    this._iv = setInterval(() => {
      const i = (this.state.i + 1) % this.seq.length;
      const v = this.seq[i];
      const peak = i === 0 ? v : Math.max(this.state.peak, v);
      this.setState({ i, peak });
    }, 420);
  }
  componentWillUnmount() {
    clearInterval(this._iv);
  }
  arc(p1, p2, r) {
    const cx = 300, cy = 290;
    const pt = (p) => {
      const t = Math.PI * (1 - p / 100);
      return (cx + r * Math.cos(t)).toFixed(1) + ' ' + (cy - r * Math.sin(t)).toFixed(1);
    };
    return 'M' + pt(p1) + ' A' + r + ' ' + r + ' 0 0 1 ' + pt(p2);
  }
  renderVals() {
    const level = this.seq[this.state.i];
    const peak = this.state.peak;
    return {
      level,
      peak,
      deg: (level - 50) * 1.8,
      peakDeg: (peak - 50) * 1.8,
      seg1: this.arc(0, 25, 240),
      seg2: this.arc(25, 50, 240),
      seg3: this.arc(50, 75, 240),
      seg4: this.arc(75, 100, 240),
      outline: this.arc(0, 100, 270)
    };
  }
}
</script>
</body>
</html>
