<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Projection : Verdict au jugement majoritaire</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 28px 48px 26px; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="padding: 4px 14px; border-radius: 999px; background: #B9A6FF; border: 2px solid #1B1530; font-size: 17px; font-weight: 700">Verdict · jugement majoritaire</span>
      <span style="font-size: 18px"><strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px">42</strong> votants</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 42px; line-height: 1.05; font-weight: 800; letter-spacing: -1px">Quel aménagement pour la place du Marché ?</h1>
  </header>

  <div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 16px">
    <sc-for list="{{legend}}" as="m" hint-placeholder-count="6">
      <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 20px; height: 20px; border-radius: 6px; border: 2px solid #1B1530; background: {{m.color}}"></span>{{m.name}}</span>
    </sc-for>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; padding: 18px 24px; border-radius: 32px; background: #FFFFFF; border: 3px solid #1B1530; box-shadow: 6px 6px 0 #1B1530">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 176px; align-items: center; gap: 16px">
        <span style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #1B1530; background: {{r.rankBg}}; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">{{r.rank}}</span>
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <span style="font-size: 21px; font-weight: 700">{{r.name}}</span>
          <div style="position: relative; display: flex; height: 36px; border-radius: 12px; overflow: hidden; border: 3px solid #1B1530">
            <sc-for list="{{r.segs}}" as="s" hint-placeholder-count="6">
              <div style="width: {{s.pct}}%; background: {{s.color}}; color: {{s.ink}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{s.label}}</div>
            </sc-for>
            <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 0; border-left: 4px dashed #1B1530"></div>
          </div>
        </div>
        <span style="text-align: center; padding: 8px 10px; border-radius: 999px; border: 3px solid #1B1530; font-size: 18px; font-weight: 700; background: {{r.medColor}}; color: {{r.medInk}}">{{r.median}}</span>
      </div>
    </sc-for>
  </div>

  <p style="margin: 0; font-size: 17px; color: #5B5570">Le pointillé marque la moitié de la salle. La mention médiane, celle que la moitié des votants accorde au moins, fixe le classement.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const mentions = [
      { name: 'À rejeter', color: '#D9381E', ink: '#FFFFFF' },
      { name: 'Insuffisant', color: '#FF8A5B', ink: '#1B1530' },
      { name: 'Passable', color: '#EDE8FA', ink: '#1B1530' },
      { name: 'Assez bien', color: '#B9A6FF', ink: '#1B1530' },
      { name: 'Bien', color: '#7C4DFF', ink: '#FFFFFF' },
      { name: 'Excellent', color: '#4A1FD1', ink: '#FFFFFF' }
    ];
    const props = [
      { name: 'Halles couvertes ouvertes toute l’année', v: [2, 3, 6, 9, 13, 9] },
      { name: 'Jardin partagé et jeux pour enfants', v: [3, 4, 7, 10, 12, 6] },
      { name: 'Parking réorganisé et terrasses', v: [6, 8, 9, 10, 6, 3] },
      { name: 'Garder la place en l’état', v: [12, 10, 8, 6, 4, 2] }
    ];
    const total = 42;
    const medianIdx = (v) => {
      let acc = 0;
      for (let i = 0; i < v.length; i++) { acc += v[i]; if (acc >= total / 2) return i; }
      return v.length - 1;
    };
    const rankBg = ['#FFD23F', '#FFFFFF', '#FFFFFF', '#FFFFFF'];
    return {
      legend: mentions,
      rows: props.map((p, k) => {
        const mi = medianIdx(p.v);
        return {
          rank: k + 1,
          rankBg: rankBg[k],
          name: p.name,
          median: mentions[mi].name,
          medColor: mentions[mi].color,
          medInk: mentions[mi].ink,
          segs: p.v.map((n, i) => ({
            pct: (n / total) * 100,
            color: mentions[i].color,
            ink: mentions[i].ink,
            label: n >= 4 ? String(n) : ''
          }))
        };
      })
    };
  }
}
</script>
</body>
</html>
