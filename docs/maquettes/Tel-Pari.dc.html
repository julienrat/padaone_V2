<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone : Pari de certitude</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#6C3BFF}a:hover{color:#4A1FD1}
.sig{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:18px;background:transparent;font:inherit;font-size:12px;color:#FFFFFF;cursor:pointer}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3FF; color: #1B1530; font-family: 'Lexend', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
    <span style="padding: 4px 12px; border-radius: 999px; background: #6C3BFF; color: #FFFFFF; border: 2px solid #1B1530; font-size: 14px; font-weight: 700">Pari de certitude · 3/5</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2DD4A7; border: 2px solid #1B1530"></span>Connecté</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 12px; min-height: 0">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 25px; line-height: 1.1; font-weight: 800; letter-spacing: -0.5px">Quelqu'un monopolise la parole : que faites-vous d'abord ?</h1>

    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; justify-content: center; align-items: center; text-align: center; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 3px solid #1B1530; box-shadow: 5px 5px 0 #1B1530">
        <span style="width: 76px; height: 76px; border-radius: 50%; background: #FFD23F; border: 3px solid #1B1530; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">Pari enregistré !</p>
        <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #5B5570">Les yeux sur l'écran : la répartition de la salle arrive.</p>
        <button type="button" onClick="{{edit}}" style="min-height: 46px; padding: 0 18px; border-radius: 16px; border: 2px solid #1B1530; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #1B1530">Modifier</button>
      </div>
    </sc-if>

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px; border-radius: 18px; border: 3px solid #1B1530; background: {{o.bg}}; box-shadow: {{o.shadow}}; font: inherit; font-size: 15px; font-weight: 500; color: #1B1530; text-align: left; cursor: pointer">
            <span style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 12px; border: 2px solid #1B1530; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; background: {{o.badge}}">{{o.key}}</span>
            <span>{{o.text}}</span>
          </button>
        </sc-for>
        <span style="margin-top: 4px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">Et vous en êtes sûr·e ?</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; opacity: {{certOpacity}}">
          <sc-for list="{{certs}}" as="c" hint-placeholder-count="3">
            <button type="button" onClick="{{c.pick}}" disabled="{{noAnswer}}" aria-pressed="{{c.pressed}}" style="min-height: 64px; padding: 4px; border-radius: 18px; border: 3px solid #1B1530; background: {{c.bg}}; font: inherit; font-size: 14px; font-weight: 700; line-height: 1.2; color: #1B1530; cursor: pointer">{{c.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{send}}" disabled="{{cannotSend}}" style="margin-top: auto; min-height: 58px; border-radius: 20px; border: 3px solid #1B1530; background: {{sendBg}}; color: #FFFFFF; box-shadow: {{sendShadow}}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; cursor: pointer">Je parie !</button>
    </sc-if>
  </main>

  <nav aria-label="Signal discret" style="margin: 0 12px 14px; padding: 6px; border-radius: 26px; background: #1B1530; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <button type="button" class="sig"><span class="ic" style="background: #FFD23F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M4 6l7 6-7 6"></path><path d="M13 6l7 6-7 6"></path></svg></span>Trop vite</button>
    <button type="button" class="sig"><span class="ic" style="background: #FF7AC6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 9a3 3 0 0 1 6 1c0 2-3 2.5-3 4.5"></path><path d="M12 18.5v.5"></path></svg></span>Perdu·e</button>
    <button type="button" class="sig"><span class="ic" style="background: #2DD4A7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></span>Un exemple</button>
    <button type="button" class="sig"><span class="ic" style="background: #49A8FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1530" aria-hidden="true" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg></span>Une pause</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answer: 'B', cert: null, sent: false };
  }
  renderVals() {
    const s = this.state;
    const opts = [
      { key: 'A', text: 'Rappeler les règles du groupe' },
      { key: 'B', text: 'Reformuler son propos, puis ouvrir aux autres' },
      { key: 'C', text: 'Lui couper la parole fermement' },
      { key: 'D', text: 'Attendre qu’il ait fini' }
    ];
    const certs = [
      { label: 'Je devine', on: '#FFE1D6' },
      { label: 'Je pense', on: '#FFD23F' },
      { label: 'J’en suis sûr·e', on: '#2DD4A7' }
    ];
    const can = s.answer !== null && s.cert !== null;
    return {
      sent: s.sent,
      notSent: !s.sent,
      noAnswer: s.answer === null,
      certOpacity: s.answer === null ? 0.45 : 1,
      cannotSend: !can,
      sendBg: can ? '#6C3BFF' : '#A79FC2',
      sendShadow: can ? '4px 4px 0 #1B1530' : 'none',
      options: opts.map((o) => {
        const on = s.answer === o.key;
        return {
          key: o.key, text: o.text, pressed: on ? 'true' : 'false',
          bg: on ? '#E4DAFF' : '#FFFFFF',
          badge: on ? '#FFD23F' : '#F6F3FF',
          shadow: on ? '4px 4px 0 #1B1530' : 'none',
          pick: () => this.setState({ answer: o.key })
        };
      }),
      certs: certs.map((c, i) => ({
        label: c.label,
        pressed: s.cert === i ? 'true' : 'false',
        bg: s.cert === i ? c.on : '#FFFFFF',
        pick: () => this.setState({ cert: i })
      })),
      send: () => { if (can) this.setState({ sent: true }); },
      edit: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
